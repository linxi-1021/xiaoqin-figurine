lectorAll('.card').forEach(b=>{b.hidden=!!((q&&!b.dataset.search.includes(q))||(g&&b.dataset.group!==g));if(!b.hidden)count++});document.querySelector('#count').textContent=count+' 张'}document.querySelector('#search').oninput=filter;document.querySelector('#group').onchange=filter;filter();</script></html>
